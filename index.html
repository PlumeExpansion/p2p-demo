<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P2P 3D Sphere Game - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; /* Prevents scrollbars in 3D canvas */
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10; /* Keeps controls above the 3D WebGL canvas */
      background: rgba(0,0,0,0.7);
      padding: 12px;
      border-radius: 6px;
    }
    input, button {
      padding: 6px;
      margin: 2px;
    }
  </style>
  <!-- Load Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Load PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="ui">
    <button id="hostBtn">Host Game</button>
    <br><br>
    <input type="text" id="joinIdInput" placeholder="Enter Host ID" />
    <button id="joinBtn">Join Game</button>
    <p id="status">Status: Waiting for action...</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
